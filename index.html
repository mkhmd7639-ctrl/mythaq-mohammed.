<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قالب الكشوفات الرسمية - مربوط بتيليجرام</title>
    <!-- استيراد مكتبة خطوط عربية ضخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=Changa:wght@300;400;500;600;700;800&family=El+Messiri:wght@400;500;600;700&family=Harmattan:wght@400;700&family=Lateef&family=Marhey:wght@400;500;600;700;900&family=Mirza:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Rakkas&family=Scheherazade+New:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Katibeh&family=Lalezar&family=Lemonada:wght@400;500;600;700&family=Zain:wght@300;400;700;800;900&family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Almarai:wght@300;400;700;800&family=Alexandria:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Qahiri&family=Mada:wght@300;400;500;600;700;900&family=Vibes&family=Amiri+Quran&family=Athiti:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        @page {
            size: A4 landscape;
            margin: 5mm;
        }
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            color: #000;
            direction: rtl;
            background-color: #eef2f5;
        }
        .control-panel {
            text-align: center;
            margin: 10px auto;
            background: #ffffff;
            padding: 10px 15px;
            width: 95%;
            max-width: 1350px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 10px;
            z-index: 1000;
        }
        .btn {
            background: #00695c;
            color: #fff;
            border: none;
            padding: 6px 12px;
            font-size: 9pt;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { background: #004d40; }
        .btn-green { background: #2e7d32; }
        .btn-green:hover { background: #1b5e20; }
        .btn-blue { background: #1565c0; }
        .btn-blue:hover { background: #0d47a1; }
        .btn-red { background: #c62828; }
        .btn-red:hover { background: #8e0000; }
        .btn-telegram { background: #0088cc; color: #fff; }
        .btn-telegram:hover { background: #006699; }
        .btn-save { background: #7b1fa2; color: #fff; }
        .btn-save:hover { background: #4a148c; }
        .btn-archive { background: #0277bd; color: #fff; }
        .btn-archive:hover { background: #01579b; }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 9pt;
            font-weight: bold;
        }
        select, input[type="color"], input[type="text"] {
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            font-size: 9pt;
            height: 30px;
            background: #fff;
            box-sizing: border-box;
        }
        input[type="color"] {
            width: 32px;
            padding: 0;
            border: none;
            background: none;
        }
        .search-input {
            width: 160px;
            cursor: text !important;
        }

        .sheet-container {
            width: 297mm;
            height: 198mm;
            padding: 5mm 8mm;
            margin: 15px auto;
            background: #fff;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            page-break-before: always;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            padding-bottom: 2px;
            margin-bottom: 4px;
            font-size: 11pt;
            font-weight: bold;
        }
        .editable-header {
            border: 1px dashed transparent;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .editable-header:hover { border-color: #00695c; background: #f9f9f9; }
        .editable-header:focus { outline: 2px solid #00695c; background: #fffde7; }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 5px;
            flex-grow: 1;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed !important;
        }
        
        th, td {
            border: 1px solid #333;
            padding: 4px 3px;
            font-size: 9.5pt;
            height: 22px;
            overflow: hidden;
            word-wrap: break-word;
        }
        th {
            background-color: #d1d8e0 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            color: #111;
            font-weight: bold;
            position: relative;
            cursor: pointer;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        td[contenteditable="true"]:focus, th[contenteditable="true"]:focus {
            background-color: #fffde7;
            outline: 2px solid #00695c;
        }

        .active-column { background-color: #e8f8f5 !important; }
        .active-row { background-color: #fff3e0 !important; }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 8.5pt;
            color: #444;
            border-top: 1px solid #888;
            padding-top: 2px;
            margin-top: auto;
        }

        #archiveModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .archive-content {
            background: #fff;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            overflow-y: auto;
        }
        .archive-item {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .archive-item-info { font-size: 10pt; font-weight: bold; color: #333; }

        @media print {
            body { background: #fff; }
            .control-panel, #archiveModal { display: none !important; }
            .sheet-container { box-shadow: none !important; margin: 0 !important; width: 100% !important; height: 198mm !important; padding: 4mm !important; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <button class="btn" onclick="window.print()">🖨️ طباعة / PDF</button>
        <button class="btn btn-blue" onclick="addNewPage()">📄 صفحة جديدة</button>
        
        <!-- زر إرسال البيانات إلى تيليجرام للبوت الخاص بك -->
        <button class="btn btn-telegram" onclick="sendDataToTelegram()">📤 إرسال لتليجرام</button>
        
        <button class="btn btn-save" onclick="saveToArchive()">💾 حفظ بالأرشيف</button>
        <button class="btn btn-archive" onclick="openArchiveModal()">📁 الحافظة</button>
        
        <div class="control-group" style="background: #e0f2f1;">
            <span>🔍 بحث:</span>
            <input type="text" id="tableSearchInput" class="search-input" placeholder="بحث بلا همزات..." onkeyup="filterTableRows()">
        </div>
        
        <button class="btn btn-red" onclick="resetAllData()" style="background: #b71c1c;">🗑️ مسح</button>
        
        <button class="btn btn-green" onclick="addRowToActiveTable()">➕ صف</button>
        <button class="btn btn-green" onclick="addColumnToActiveTable()">➕ عمود</button>
        <button class="btn btn-red" onclick="deleteSelectedRow()">❌ حذف صف</button>
        <button class="btn btn-red" onclick="deleteSelectedColumn()">❌ حذف عمود</button>
    </div>

    <div id="archiveModal">
        <div class="archive-content">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00695c; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #00695c;">📁 حافظة الأعمال والأرشيف المركزي</h3>
                <button class="btn btn-red" onclick="closeArchiveModal()">✖ إغلاق</button>
            </div>
            <div id="archiveListContainer"></div>
        </div>
    </div>

    <div id="pagesWrapper">
        <div class="sheet-container" onclick="setActiveContext(this, event)">
            <div class="header-top">
                <div class="editable-header" contenteditable="true">الجمهورية اليمنية</div>
                <div class="editable-header" contenteditable="true" style="font-size: 11pt;">كشف البيانات والمسيرات الرسمية (الصفحة 1)</div>
                <div class="editable-header" contenteditable="true">التاريخ: 2026/09/22</div>
            </div>

            <div class="table-wrapper">
                <table class="dynamicTable">
                    <thead>
                        <tr>
                            <th style="width: 35px;" onclick="selectColumn(this, event)"><span contenteditable="true">م</span></th>
                            <th style="width: 160px;" onclick="selectColumn(this, event)"><span contenteditable="true">الاسم الرباعي</span></th>
                            <th style="width: 80px;" onclick="selectColumn(this, event)"><span contenteditable="true">نوع البطاقة</span></th>
                            <th style="width: 100px;" onclick="selectColumn(this, event)"><span contenteditable="true">رقم البطاقة</span></th>
                            <th style="width: 90px;" onclick="selectColumn(this, event)"><span contenteditable="true">رقم الاتصال</span></th>
                            <th style="width: 160px;" onclick="selectColumn(this, event)"><span contenteditable="true">اسم الزوجة / الزوج</span></th>
                            <th style="width: 70px;" onclick="selectColumn(this, event)"><span contenteditable="true">الحالة</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <script>
                            for (let i = 1; i <= 15; i++) {
                                document.write(`
                                    <tr onclick="selectRow(this, event)">
                                        <td>${i}</td>
                                        <td style="text-align: right; padding-right: 5px;" contenteditable="true"></td>
                                        <td contenteditable="true"></td>
                                        <td contenteditable="true"></td>
                                        <td contenteditable="true"></td>
                                        <td style="text-align: right; padding-right: 5px;" contenteditable="true"></td>
                                        <td contenteditable="true"></td>
                                    </tr>
                                `);
                            }
                        </script>
                    </tbody>
                </table>
            </div>

            <div class="footer-bottom">
                <div class="editable-header" contenteditable="true">البريد الإلكتروني / جهة الإصدار</div>
                <div class="editable-header" contenteditable="true">الإصدار: 2026.09</div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // بيانات بوتك وتيليجرام مدمجة بالكامل:
        // ==========================================
        const TELEGRAM_BOT_TOKEN = "8638249103:AAGKy6YFnGKfMss9Zt-f9hbCX-WmU-WJjc0"; 
        const TELEGRAM_CHAT_ID = "7962257606";
        // ==========================================

        let activeSheet = null;
        let activeTable = null;
        let activeColumnIndex = 0;
        let activeRowElement = null;
        let activeThElement = null;
        let activeCellElement = null;

        async function sendDataToTelegram() {
            if (!activeRowElement) {
                alert("الرجاء النقر واختيار (الصف) الخاص بالشخص الذي تريد إرسال بياناته أولاً!");
                return;
            }

            let headers = [];
            let activeTableEl = activeRowElement.closest('table');
            activeTableEl.querySelectorAll('thead th span').forEach(thSpan => {
                headers.push(thSpan.innerText.trim());
            });

            let cells = activeRowElement.querySelectorAll('td');
            let rowDataText = "📋 **بيانات مُسجلة جديدة (عبر المنظومة):**\n\n";
            
            cells.forEach((cell, idx) => {
                let headerName = headers[idx] || `عمود ${idx+1}`;
                let cellValue = cell.innerText.trim() || "فارغ";
                rowDataText += `🔹 *${headerName}:* ${cellValue}\n`;
            });

            let url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            try {
                let response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: rowDataText,
                        parse_mode: 'Markdown'
                    })
                });

                let result = await response.json();
                if (result.ok) {
                    alert("✅ تم إرسال البيانات إلى بوت تيليجرام بنجاح!");
                } else {
                    alert("❌ فشل الإرسال: " + result.description);
                }
            } catch (error) {
                console.error(error);
                alert("❌ حدث خطأ في الاتصال بالشبكة.");
            }
        }

        function normalizeArabic(text) {
            if (!text) return "";
            return text
                .toString()
                .toLowerCase()
                .replace(/[\u064b-\u065f]/g, '')
                .replace(/[أإآا]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ؤ/g, 'و')
                .replace(/ئ/g, 'ي')
                .replace(/ى/g, 'ي');
        }

        function filterTableRows() {
            let input = document.getElementById('tableSearchInput');
            let filter = normalizeArabic(input.value.trim());
            let tables = document.querySelectorAll('.dynamicTable');

            tables.forEach(table => {
                let rows = table.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    let match = false;
                    let cells = row.querySelectorAll('td');
                    cells.forEach((cell, idx) => {
                        if (idx > 0 && normalizeArabic(cell.innerText).includes(filter)) {
                            match = true;
                        }
                    });
                    row.style.display = (filter === "" || match) ? "" : "none";
                });
            });
        }

        function saveToArchive() {
            document.querySelectorAll('[contenteditable="true"]').forEach(el => {
                if (el.innerText.trim() !== "") el.setAttribute('textContent', el.innerText);
            });
            let wrapperHtml = document.getElementById('pagesWrapper').innerHTML;
            let archives = JSON.parse(localStorage.getItem('toufan_my_works_archive') || '[]');
            let timeString = new Date().toLocaleDateString('ar-YE') + ' - ' + new Date().toLocaleTimeString('ar-YE', {hour: '2-digit', minute:'2-digit'});
            archives.push({ id: Date.now(), title: 'عمل محفوظ: ' + timeString, html: wrapperHtml });
            localStorage.setItem('toufan_my_works_archive', JSON.stringify(archives));
            alert("✅ تم الحفظ في الأرشيف!");
        }

        function openArchiveModal() {
            let container = document.getElementById('archiveListContainer');
            container.innerHTML = '';
            let archives = JSON.parse(localStorage.getItem('toufan_my_works_archive') || '[]');
            if (archives.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888; padding: 20px;">لا توجد أعمال محفوظة.</p>`;
            } else {
                archives.forEach((item, index) => {
                    let div = document.createElement('div');
                    div.className = 'archive-item';
                    div.innerHTML = `
                        <div class="archive-item-info"><span>📄 ${index + 1}. ${item.title}</span></div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-green" style="padding: 4px 8px; font-size: 8.5pt;" onclick="loadArchiveItem(${item.id})">📂 استرجاع</button>
                            <button class="btn btn-red" style="padding: 4px 8px; font-size: 8.5pt;" onclick="deleteArchiveItem(${item.id})">🗑️ حذف</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
            document.getElementById('archiveModal').style.display = 'flex';
        }

        function closeArchiveModal() { document.getElementById('archiveModal').style.display = 'none'; }

        function loadArchiveItem(id) {
            let archives = JSON.parse(localStorage.getItem('toufan_my_works_archive') || '[]');
            let found = archives.find(item => item.id === id);
            if (found) {
                document.getElementById('pagesWrapper').innerHTML = found.html;
                closeArchiveModal();
                alert("📂 تم الاسترجاع بنجاح!");
            }
        }

        function deleteArchiveItem(id) {
            if (confirm("هل تريد الحذف؟")) {
                let archives = JSON.parse(localStorage.getItem('toufan_my_works_archive') || '[]');
                archives = archives.filter(item => item.id !== id);
                localStorage.setItem('toufan_my_works_archive', JSON.stringify(archives));
                openArchiveModal();
            }
        }

        function resetAllData() { if (confirm("مسح الصفحة؟")) location.reload(); }

        function setActiveContext(sheetContainer, event) {
            activeSheet = sheetContainer;
            activeTable = sheetContainer.querySelector('table');
            if (event && event.target) {
                let th = event.target.closest('th');
                let td = event.target.closest('td');
                let tr = event.target.closest('tr');
                if (th) selectColumn(th, event);
                else if (td && tr && tr.parentElement.tagName === 'TBODY') {
                    selectRow(tr, event);
                    activeCellElement = td;
                }
            }
        }

        function selectColumn(thElement, event) {
            if (event) event.stopPropagation();
            let row = thElement.parentElement;
            let colIdx = Array.from(row.children).indexOf(thElement);
            let table = thElement.closest('table');
            activeTable = table;
            activeColumnIndex = colIdx;
            activeThElement = thElement;
            table.querySelectorAll('th, td').forEach(el => el.classList.remove('active-column'));
            table.querySelectorAll('tr').forEach(r => { if (r.children[colIdx]) r.children[colIdx].classList.add('active-column'); });
        }

        function selectRow(trElement, event) {
            if (event) event.stopPropagation();
            if (trElement.parentElement.tagName !== 'TBODY') return;
            let table = trElement.closest('table');
            activeTable = table;
            table.querySelectorAll('tbody tr').forEach(r => r.classList.remove('active-row'));
            trElement.classList.add('active-row');
            activeRowElement = trElement;
        }

        function addRowToActiveTable() {
            if (!activeTable) { let firstSheet = document.querySelector('.sheet-container'); setActiveContext(firstSheet, { target: firstSheet }); }
            let tbody = activeTable.querySelector('tbody');
            let newRow = tbody.insertRow();
            newRow.setAttribute('onclick', 'selectRow(this, event)');
            for (let c = 0; c < activeTable.querySelector('thead tr').cells.length; c++) {
                let cell = newRow.insertCell();
                cell.contentEditable = "true";
                if (c === 0) cell.innerText = tbody.rows.length;
                else { cell.style.textAlign = "right"; cell.style.paddingRight = "5px"; }
            }
            selectRow(newRow, { stopPropagation: () => {} });
        }

        function addColumnToActiveTable() {
            if (!activeTable) { let firstSheet = document.querySelector('.sheet-container'); setActiveContext(firstSheet, { target: firstSheet }); }
            let headerRow = activeTable.querySelector('thead tr');
            let th = document.createElement('th');
            th.style.width = "80px";
            th.setAttribute('onclick', 'selectColumn(this, event)');
            th.innerHTML = `<span contenteditable="true">جديد</span>`;
            headerRow.appendChild(th);
            activeTable.querySelectorAll('tbody tr').forEach(row => {
                let td = row.insertCell();
                td.setAttribute("contenteditable", "true");
                td.style.textAlign = "right";
                td.style.paddingRight = "5px";
            });
        }

        function deleteSelectedRow() {
            if (!activeRowElement) { alert("اختر الصف أولاً!"); return; }
            let tbody = activeRowElement.parentElement;
            if (tbody.rows.length > 1) {
                activeRowElement.remove();
                activeRowElement = null;
                Array.from(tbody.rows).forEach((row, idx) => { if (row.cells[0]) row.cells[0].innerText = idx + 1; });
            } else { alert("لا يمكن حذف الصف الأخير!"); }
        }

        function deleteSelectedColumn() {
            let headerRow = activeTable.querySelector('thead tr');
            if (headerRow.cells.length > 1) {
                headerRow.deleteCell(activeColumnIndex);
                activeTable.querySelectorAll('tbody tr').forEach(row => { if (row.cells.length > activeColumnIndex) row.deleteCell(activeColumnIndex); });
            } else { alert("لا يمكن حذف العمود الوحيد!"); }
        }

        function addNewPage() {
            let wrapper = document.getElementById('pagesWrapper');
            let pageCount = wrapper.querySelectorAll('.sheet-container').length + 1;
            let newPage = document.createElement('div');
            newPage.className = 'sheet-container';
            newPage.setAttribute('onclick', 'setActiveContext(this, event)');
            newPage.innerHTML = `
                <div class="header-top">
                    <div class="editable-header" contenteditable="true">عنوان الكشف</div>
                    <div class="editable-header" contenteditable="true" style="font-size: 11pt;">صفحة جديدة (${pageCount})</div>
                    <div class="editable-header" contenteditable="true">التاريخ: ---</div>
                </div>
                <div class="table-wrapper">
                    <table class="dynamicTable">
                        <thead>
                            <tr>
                                ${Array.from({length: 7}, (_, i) => `<th style="width: 90px;" onclick="selectColumn(this, event)"><span contenteditable="true">العمود ${i+1}</span></th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${Array.from({length: 12}, (_, r) => `<tr onclick="selectRow(this, event)"><td contenteditable="true">${r+1}</td>${'<td contenteditable="true"></td>'.repeat(6)}</tr>`).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="footer-bottom">
                    <div class="editable-header" contenteditable="true">ملاحظات</div>
                    <div class="editable-header" contenteditable="true">التوقيع: ---</div>
                </div>
            `;
            wrapper.appendChild(newPage);
            setActiveContext(newPage, { target: newPage });
        }

        window.onload = function() {
            let firstSheet = document.querySelector('.sheet-container');
            if (firstSheet) setActiveContext(firstSheet, { target: firstSheet });
        };
    </script>
</body>
</html>
